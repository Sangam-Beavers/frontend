# SonarQube 분석 설정 — front-app
sonar.projectKey=gb-front-app
sonar.projectName=gb-front-app
sonar.projectVersion=1.0

# 분석 대상
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/figma/**

# TypeScript/JavaScript
sonar.language=ts
sonar.sourceEncoding=UTF-8

# 생성 파일·CSS 모듈은 중복 검사 제외 (CPD false-positive 방지)
sonar.cpd.exclusions=src/types/api/**,**/*.module.css
