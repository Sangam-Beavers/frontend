# ─────────────────────────────────────────────────────────────
# front-app nginx config
# - SPA fallback (React Router)
# - /api/v1/* → 백엔드 서비스로 reverse proxy
# - 백엔드 서비스명/포트는 k8s 내부 DNS 사용
# ─────────────────────────────────────────────────────────────

# Member 서비스
upstream member_backend {
    server member-service.gb-dev.svc.cluster.local:8080;
}

# Wallet 서비스
upstream wallet_backend {
    server wallet-service.gb-dev.svc.cluster.local:8080;
}

# Community 서비스
upstream community_backend {
    server community-service.gb-dev.svc.cluster.local:8080;
}

# Document 서비스
upstream document_backend {
    server document-service.gb-dev.svc.cluster.local:8080;
}

server {
    listen 80;
    server_name _;

    # 정적 파일 위치
    root /usr/share/nginx/html;
    index index.html;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 정적 자산 캐시 (Vite 빌드 산출물의 hashed filename 활용)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api/v1/wallets, /api/v1/transfers, /api/v1/accounts, /api/v1/exchange, /api/v1/scheduled-transfers → wallet
    location ~ ^/api/v1/(wallets|transfers|accounts|exchange|scheduled-transfers) {
        proxy_pass http://wallet_backend;
        include /etc/nginx/proxy_params.conf;
    }

    # /api/v1/members, /api/v1/verifications, /api/v1/auth → member
    location ~ ^/api/v1/(members|verifications|auth) {
        proxy_pass http://member_backend;
        include /etc/nginx/proxy_params.conf;
    }

    # /api/v1/posts, /api/v1/comments, /api/v1/likes, /api/v1/qna → community
    location ~ ^/api/v1/(posts|comments|likes|qna) {
        proxy_pass http://community_backend;
        include /etc/nginx/proxy_params.conf;
    }

    # /api/v1/documents → document
    location ~ ^/api/v1/documents {
        proxy_pass http://document_backend;
        include /etc/nginx/proxy_params.conf;
    }

    # SPA fallback — 위 location에 매칭 안 되는 모든 요청은 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # health check (k8s readiness/liveness probe용)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
